version: "3.9"

services:

  db:
    image: postgres:16
    restart: always

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .

    command: python manage.py runserver 0.0.0.0:8000

    ports:
    - "8000:8000"

    volumes:
      - ./app:/app

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

volumes:
  postgres_data: