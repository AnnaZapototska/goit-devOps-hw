version: "3.9"

services:

  db:
    image: postgres:16
    restart: always

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./app:/app

    env_file:
      - .env

    depends_on:
      - db

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

volumes:
  postgres_data:
